# ============================================================
# SkillsBin — 推送到主分支时构建并发布（代码/模板改动走这条）
# ------------------------------------------------------------
# 数据更新由 sync.yml 负责（并发组 pages-publish 与本工作流互斥，
# 两次 Pages 部署不会交叉）。
# ============================================================

name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'crawler/config.json'
      # data/** 也要触发：中文摘要覆盖层（data/desczh.json）与纠错后的明细层
      # 只改数据、不动代码，若这里不列，纯数据推送就不会重建发布 —— 页面会停在旧内容。
      # sync.yml 自己的提交用的是 GITHUB_TOKEN，不会触发本工作流（GitHub 有意抑制），
      # 所以不存在「CI 提交数据 → 又触发一次部署」的循环。
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site bundle
        run: bash scripts/build-dist.sh

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4
          wrangler --version
          wrangler pages deploy dist \
            --project-name=skillsbin \
            --branch=main \
            --commit-dirty=true
